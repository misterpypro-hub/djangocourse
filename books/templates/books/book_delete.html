{% extends '_base.html' %}

{% load crispy_forms_tags %}

{% block page_title %}حذف کتاب {{ book.title }}{% endblock %}


{% block content %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <P> آیا از حذف کتاب {{ book.title }}مطمئن هستید؟</P>
        <button type="submit" class="btn btn-success mt-2">حذف</button>
    </form>
    <br>
    <a href="{% url 'book_list' %}">لیست کتاب ها</a>

{% endblock %}
