{% extends '_base.html' %}

{% load crispy_forms_tags %}

{% block page_title %}ویرایش کتاب {{ book.title }}{% endblock %}


{% block content %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-success mt-2">ویرایش</button>
    </form>
    <br>
    <a href="{% url 'book_list' %}">لیست کتاب ها</a>

{% endblock %}
